[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharptoolz"
version = "0.2.0"
description = "Official Python client for the SharpToolz API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=12,<16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sharptoolz = ["py.typed"]
