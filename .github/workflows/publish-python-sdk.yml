name: Publish Python SDK

on:
  workflow_dispatch:

concurrency: publish-python-sdk

permissions:
  contents: read

jobs:
  build:
    name: Test and build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling and SDK dependencies
        run: python -m pip install --upgrade build twine ./sdk/python

      - name: Run SDK tests
        working-directory: sdk/python
        run: python -m unittest discover -s tests -v

      - name: Build SDK distributions
        run: python -m build sdk/python --outdir dist

      - name: Check SDK distributions
        run: python -m twine check dist/*

      - name: Store SDK distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sharptoolz/
    permissions:
      id-token: write

    steps:
      - name: Download SDK distributions
        uses: actions/download-artifact@v4
        with:
          name: python-sdk-distributions
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
